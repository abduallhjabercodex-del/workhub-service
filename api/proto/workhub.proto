syntax = "proto3";

package workhub.v1;

option go_package = "example.com/day1-go-service/api/gen/workhub/v1;workhubv1";

import "google/protobuf/timestamp.proto";

service WorkHubService {
  rpc CreateProject(CreateProjectRequest) returns (Project);
  rpc GetProject(GetProjectRequest) returns (Project);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc CreateTask(CreateTaskRequest) returns (Task);
  rpc GetTask(GetTaskRequest) returns (Task);
  rpc UpdateTask(UpdateTaskRequest) returns (Task);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
}

message Project {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
}

message Task {
  string id = 1;
  string project_id = 2;
  string title = 3;
  TaskStatus status = 4;
  google.protobuf.Timestamp created_at = 5;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_TODO = 1;
  TASK_STATUS_IN_PROGRESS = 2;
  TASK_STATUS_DONE = 3;
}

message CreateProjectRequest { string name = 1; }
message GetProjectRequest { string id = 1; }
message ListProjectsRequest { string query = 1; int32 page = 2; int32 page_size = 3; }
message ListProjectsResponse { repeated Project projects = 1; int32 total = 2; }
message CreateTaskRequest { string project_id = 1; string title = 2; }
message GetTaskRequest { string id = 1; }
message UpdateTaskRequest { string id = 1; optional string title = 2; optional TaskStatus status = 3; }
message ListTasksRequest { string project_id = 1; string query = 2; TaskStatus status = 3; int32 page = 4; int32 page_size = 5; }
message ListTasksResponse { repeated Task tasks = 1; int32 total = 2; }
